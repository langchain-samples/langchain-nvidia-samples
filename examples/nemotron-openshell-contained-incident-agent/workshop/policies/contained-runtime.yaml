version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /lib64
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /home/sandbox
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  nvidia_nim:
    name: nvidia-nim-hosted
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /app/.venv/bin/python
      - path: /usr/local/bin/python
      - path: /usr/local/bin/python3.12
  langsmith:
    name: langsmith-tracing
    endpoints:
      - host: api.smith.langchain.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /app/.venv/bin/python
      - path: /usr/local/bin/python
      - path: /usr/local/bin/python3.12
